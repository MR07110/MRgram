<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRgram - Aloqa uzildi</title>
    <style>
        :root {
            --primary-blue: #0088cc;
            --hover-blue: #0077b5;
            --text-dark: #445566;
            --text-muted: #7f919d;
            --bg-gradient: linear-gradient(135deg, #f5faff 0%, #e8f4ff 100%);
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-gradient);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden;
            color: var(--text-dark);
        }

        .error-wrapper {
            width: 90%;
            max-width: 600px;
            padding: 2rem;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .svg-container {
            width: 100%;
            max-width: 400px;
            margin-bottom: 1rem;
            animation: containerJump 4s steps(1) infinite;
        }

        @keyframes containerJump {
            0%, 92%, 100% { transform: translate(0,0); }
            93% { transform: translate(-3px, 2px); }
            95% { transform: translate(3px, -2px); }
        }

        .title { 
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            font-weight: 850; 
            color: var(--primary-blue);
            margin: 0.5rem 0;
        }

        .subtitle { 
            font-size: 1.1rem; 
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .timer-box {
            background: rgba(0, 136, 204, 0.05);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--primary-blue);
            font-weight: 600;
        }

        .btn-back {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            background-color: var(--primary-blue);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 136, 204, 0.2);
        }

        .btn-back:hover {
            background-color: var(--hover-blue);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="error-wrapper">
        <div class="svg-container">
            <img src="404.svg" alt="404 Error" style="width: 100%;">
        </div>
        
        <h1 class="title">ALOQA UZILDI</h1>
        <p class="subtitle">Siz qidirayotgan manzil koinotda adashib qoldi.</p>

        <div class="timer-box" id="timer-display">
            10 soniyadan so'ng asosiy sahifaga qaytasiz...
        </div>

        <a href="https://mrgram.vercel.app" class="btn-back">Hozir qaytish</a>
    </div>

    <script>
        let timeLeft = 10;
        const display = document.getElementById('timer-display');

        // Har soniyada ekrandagi raqamni yangilash
        const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                display.innerText = `${timeLeft} soniyadan so'ng asosiy sahifaga qaytasiz...`;
            } else {
                display.innerText = "Yo'naltirilmoqda...";
                clearInterval(countdown);
            }
        }, 1000);

        // 10 soniyadan keyin to'liq URL-ga o'tish
        setTimeout(() => {
            window.location.href = "https://mrgram.vercel.app";
        }, 10000);
    </script>
</body>
</html>
