<script type="module" src="assets/js/app.js"></script>

<!-- Audio unlock -->
<script>
    (function unlockAudio() {
        let unlocked = false;
        const unlock = () => {
            if (unlocked) return;
            const audio = new Audio();
            audio.play().then(() => {
                unlocked = true;
                document.removeEventListener('click', unlock);
                document.removeEventListener('touchstart', unlock);
                const sounds = [
                    "assets/sounds/abonent-stop.mp3",
                    "assets/sounds/band.mp3",
                    "assets/sounds/call-in.mp3",
                    "assets/sounds/call-out.mp3",
                    "assets/sounds/red-btn.mp3",
                    "assets/sounds/tarmoqda_emas.mp3",
                    "assets/sounds/notification.mp3"
                ];
                sounds.forEach(url => { const a = new Audio(); a.src = url; a.load(); });
                console.log("Audio unlocked");
            }).catch(e => console.log("Audio unlock pending..."));
        };
        document.addEventListener('click', unlock);
        document.addEventListener('touchstart', unlock);
    })();
</script>

<!-- Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ SW registered:', reg))
            .catch(err => console.log('❌ SW error:', err));
    }
</script>
